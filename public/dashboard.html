<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurex Labs — Administrative Operations Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080C14; color: #E2E8F0; }
        h1, h2, h3 { font-family: 'Syne', sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-800 pb-6 mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-[#00F2FE] to-[#4FACFE] bg-clip-text text-transparent">AUREX LABS HQ</h1>
                <p class="text-gray-400 text-sm mt-1">Client Pipeline & Appointment Operations Engine</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-[#0E1420] border border-gray-800 rounded-xl px-4 py-2 text-center">
                    <span class="block text-xs text-gray-400 uppercase tracking-wider">Total Leads</span>
                    <span id="total-stat" class="text-xl font-bold text-[#00F2FE]">0</span>
                </div>
                <div class="bg-[#0E1420] border border-gray-800 rounded-xl px-4 py-2 text-center">
                    <span class="block text-xs text-gray-400 uppercase tracking-wider">Pending</span>
                    <span id="pending-stat" class="text-xl font-bold text-yellow-400">0</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-[#0E1420] border border-gray-800 rounded-2xl p-6">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">📂 Incoming Deal Desk Pipeline</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase tracking-wider">
                                <th class="pb-3">Client</th>
                                <th class="pb-3">Requested Scope</th>
                                <th class="pb-3">Slot</th>
                                <th class="pb-3">Status</th>
                                <th class="pb-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="pipeline-rows" class="divide-y divide-gray-800/50 text-sm">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-[#0E1420] border border-gray-800 rounded-2xl p-6">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">📅 Week Agenda Matrix</h2>
                <div id="calendar-view" class="space-y-3">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/bookings';

        async function fetchPipeline() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderUI(data);
            } catch (err) {
                console.error("Critical dashboard sync failure:", err);
            }
        }

        function renderUI(bookings) {
            const rowContainer = document.getElementById('pipeline-rows');
            const calContainer = document.getElementById('calendar-view');
            
            // Set stats counts
            document.getElementById('total-stat').innerText = bookings.length;
            document.getElementById('pending-stat').innerText = bookings.filter(b => b.status === 'pending').length;

            rowContainer.innerHTML = '';
            calContainer.innerHTML = '';

            if(bookings.length === 0) {
                rowContainer.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-500">No appointments logged yet.</td></tr>`;
                calContainer.innerHTML = `<p class="text-gray-500 text-sm">Agenda clear.</p>`;
                return;
            }

            bookings.forEach(b => {
                // Determine layout badges based on status
                let badgeStyle = "bg-yellow-500/10 text-yellow-400 border-yellow-500/20";
                if(b.status === 'confirmed') badgeStyle = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                if(b.status === 'cancelled') badgeStyle = "bg-rose-500/10 text-rose-400 border-rose-500/20";

                // 1. Render Table Item
                rowContainer.innerHTML += `
                    <tr class="hover:bg-gray-900/30">
                        <td class="py-4">
                            <span class="block font-medium text-gray-200">${b.name}</span>
                            <span class="text-xs text-gray-400 block">${b.email}</span>
                        </td>
                        <td class="py-4 text-gray-300">
                            <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-300">${b.service}</span>
                            <p class="text-xs text-gray-400 mt-1 max-w-xs truncate">${b.message || 'No memo'}</p>
                        </td>
                        <td class="py-4 text-gray-300 font-mono text-xs">${b.time_slot}</td>
                        <td class="py-4">
                            <span class="border px-2.5 py-0.5 rounded-full text-xs ${badgeStyle}">${b.status}</span>
                        </td>
                        <td class="py-4 text-right space-x-1">
                            ${b.status === 'pending' ? `
                                <button onclick="updateStatus(${b.id}, 'confirmed')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1 rounded-md transition font-medium">Approve</button>
                                <button onclick="updateStatus(${b.id}, 'cancelled')" class="bg-gray-800 hover:bg-rose-900 text-gray-400 hover:text-white text-xs px-2.5 py-1 rounded-md transition">Deny</button>
                            ` : `<span class="text-xs text-gray-600">—</span>`}
                        </td>
                    </tr>
                `;

                // 2. Render Agenda Calendar blocks for Confirmed items
                if(b.status === 'confirmed') {
                    calContainer.innerHTML += `
                        <div class="p-3 bg-emerald-950/20 border border-emerald-900/40 rounded-xl flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-sm text-emerald-400">${b.time_slot}</h4>
                                <p class="text-xs text-gray-300 font-medium">${b.name} (${b.service})</p>
                            </div>
                            <span class="text-xs text-gray-500 font-mono">ID: #${b.id}</span>
                        </div>
                    `;
                }
            });

            if(calContainer.innerHTML === '') {
                calContainer.innerHTML = `<p class="text-gray-500 text-xs">No confirmed events schedule optimized for this calendar grid.</p>`;
            }
        }

        async function updateStatus(id, targetStatus) {
            if(!confirm(`Are you certain you wish to switch this order status to ${targetStatus}?`)) return;
            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: targetStatus })
                });
                fetchPipeline(); // Live reload
            } catch (err) {
                alert("Operation execution error.");
            }
        }

        // Auto initialization
        fetchPipeline();
        setInterval(fetchPipeline, 10000); // Polling update every 10 seconds
    </script>
</body>
</html>
